<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ef4444" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BORDA AI" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>BORDA - AI | Sistema Inteligente de Bordados Industriais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        var c = localStorage.getItem('cached_primary_color');
        if (c) {
          document.documentElement.style.setProperty('--brand-primary', c);
          var m = document.getElementById('theme-color-meta');
          if (m) m.setAttribute('content', c);
        }

        // Bloqueio Total de Pinch-Zoom e Double-Tap Zoom no Mobile (iOS & Android)
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
        
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = (new Date()).getTime();
          if (now - lastTouchEnd <= 300 && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, false);
      })();
    </script>
  </head>
  <body class="bg-[#09090d] text-zinc-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-purple-500/30 selection:text-purple-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
